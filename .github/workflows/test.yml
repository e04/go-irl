name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: go vet ./...
      - run: go test -race -shuffle=on -count=3 -coverprofile=coverage.out ./...
      - run: go test -run='^$' -fuzz=FuzzSRTPacketParsing -fuzztime=10s .
      - run: go test -run='^$' -fuzz=FuzzTelemetryFrame -fuzztime=10s .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
